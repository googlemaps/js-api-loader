## Runs the release-please action for all new pushes to the main branch.
##   This will create new release-PRs, create GitHub releases and update
##   the CHANGELOG.md.

on:
  push:
    branches: [main]

permissions:
  contents: write
  pull-requests: write
  id-token: write

name: Release Please

jobs:
  release-please:
    runs-on: ubuntu-latest
    steps:
      - id: release
        name: Release Please
        uses: googleapis/release-please-action@5c625bfb5d1ff62eadeeb3772007f7f66fdcf071 # v4

        with:
          release-type: node
          token: ${{ secrets.SYNCED_GITHUB_TOKEN_REPO }}

      # Everything below is for NPM publishing when a release is cut.
      # Note the "if" statement on all commands to make sure that publishing
      # only happens when a release is cut.

      - if: ${{ steps.release.outputs.release_created }}
        name: Checkout
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4

      - if: ${{ steps.release.outputs.release_created }}
        name: Setup Node for Dependency Installation
        uses: actions/setup-node@3235b876344d2a9aa001b8d1453c930bba69e610 # v3
        with:
          node-version: 20
          cache: npm

      - if: ${{ steps.release.outputs.release_created }}
        name: Install Dependencies
        run: npm ci

      - name: Authenticate to Google Cloud for OSS Exit Gate
        if: ${{ steps.release.outputs.release_created }}
        id: auth
        uses: google-github-actions/auth@7c6bc770dae815cd3e89ee6cdf493a5fab2cc093 # v3
        with:
          token_format: 'access_token'
          workload_identity_provider: 'projects/305452601764/locations/global/workloadIdentityPools/builders/providers/github'

      - name: Set up Cloud SDK
        if: ${{ steps.release.outputs.release_created }}
        uses: google-github-actions/setup-gcloud@aa5489c8933f4cc7a4f7d45035b3b1440c9c10db # v3

      - name: Stage to Artifact Registry and trigger OSS Exit Gate
        if: ${{ steps.release.outputs.release_created }}
        env:
          ACCESS_TOKEN: ${{ steps.auth.outputs.access_token }}
          RUN_ID: ${{ github.run_id }}
          RUN_ATTEMPT: ${{ github.run_attempt }}
        run: |
          cat << 'NPMRC' > "$HOME/.npmrc"
          registry=https://us-npm.pkg.dev/oss-exit-gate-prod/js-api-loader--npm/
          //us-npm.pkg.dev/oss-exit-gate-prod/js-api-loader--npm/:always-auth=true
          //us-npm.pkg.dev/oss-exit-gate-prod/js-api-loader--npm/:_authToken=${ACCESS_TOKEN}
          NPMRC
          trap 'rm -f "$HOME/.npmrc"' EXIT
          npm publish --access public --registry="https://us-npm.pkg.dev/oss-exit-gate-prod/js-api-loader--npm/"
          cat << 'MANIFEST' > manifest.json
          {
            "publish_all": true
          }
          MANIFEST
          gcloud storage cp manifest.json "gs://oss-exit-gate-prod-projects-bucket/js-api-loader/npm/manifests/manifest-${RUN_ID}-${RUN_ATTEMPT}.json"
